name: Ticket watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you also start it manually from the Actions tab

permissions:
  contents: write             # needed to save the state file back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check tickets
        run: python piletimaailm_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Test notification
        run: curl -d "Test from GitHub Actions" "ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Save state
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add piletimaailm_state.json
          git diff --cached --quiet || (git commit -m "Update ticket state" && git push)
