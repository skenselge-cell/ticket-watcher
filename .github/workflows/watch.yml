name: Ticket watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check tickets
        run: python piletimaailm_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add piletimaailm_state.json
          git diff --cached --quiet || (git commit -m "Update ticket state" && git push)
